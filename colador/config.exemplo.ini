; Copia este ficheiro para config.ini e preenche-o.

[telegram]
; Token dado pelo @BotFather
token =
; (Opcional) Aceitar só fotos deste grupo. O ID aparece no ecrã quando chega uma foto.
grupo_id =
; Responder no grupo a confirmar cada código inserido (sim/nao)
responder_no_grupo = sim

[adb]
adb = platform-tools/adb.exe
; (Opcional) Número de série do telemóvel/emulador, se houver mais do que um ligado (ver "adb devices")
dispositivo =

[app]
; Identificador do campo do código na app (preferível às coordenadas). Se a app não estiver
; no ecrã com este campo, o código não é escrito e é dado erro.
campo_id = 
; Elemento que só existe no ecrã de inserção (confirma que é o ecrã certo)
ecra_id = rv_stops
; Botão do ecrã principal que abre o ecrã de inserção (EM ROTA)
abrir_id = btn_route_text
; Minutos à espera que o EM ROTA fique disponível (os códigos ficam em espera)
espera_disponivel_minutos = 60
; Minutos a repetir (de minuto a minuto) um código que a app diz ainda não estar atribuído à rota
repetir_nao_atribuido_minutos = 30
; (Alternativa) Coordenadas do campo de texto. Se preenchido, toca no campo antes de escrever.
campo_x =
campo_y =
; Apagar o que estiver no campo antes de escrever (sim/nao)
limpar_campo = nao
; Como confirmar o código depois de o escrever:
;   enter = carrega na tecla Enter
;   toque = toca no botão botao_id (ou nas coordenadas botao_x/botao_y)
;   nada  = só escreve
submeter = enter
botao_id =
botao_x =
botao_y =
; Segundos de espera depois de cada código (para a app processar)
pausa_segundos = 1.5
; Não voltar a inserir códigos que já foram inseridos antes (sim/nao)
ignorar_repetidos = sim
; Se a app estiver no ecrã de login, entrar sozinho com as credenciais guardadas
; com "iniciar.bat --guardar-login" (sim/nao)
login_automatico = sim

; Minutos à espera que alguém escolha a rota no grupo
espera_rota_minutos = 15

[viaturas]
; Matrícula a registar (ícone do camião) depois de iniciar o dia, por rota
2775I = 44-36-OU
2775J = 59-80-QE
